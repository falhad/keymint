[package]
name = "keymint"
version = "0.1.0"
description = "Keymint — a fast, open-source productivity launcher"
edition = "2021"
license = "MIT"
repository = "https://github.com/falhad/keymint"

[lib]
name = "keymint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keymint-core = { path = "../crates/keymint-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
enigo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust Secret Service client (GNOME Keyring / KWallet); no libdbus needed.
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
