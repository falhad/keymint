[package]
name = "keymint-core"
version = "0.1.0"
edition = "2021"
description = "Keymint core: command registry, AI providers, config. No UI or OS dependencies."
license = "MIT"
repository = "https://github.com/falhad/keymint"

[dependencies]
async-trait = "0.1"
nucleo-matcher = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "macros"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
tempfile = "3"
